# Publishes a release when a push to main carries a package.json version that
# is not on npm yet: full CI again, then npm publish through npm trusted
# publishing (OIDC: no token is stored anywhere, and npm records provenance),
# then the matching git tag and GitHub Release with the same tarball.
# A push without a version bump publishes nothing.
name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: is this version new?
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "picomatch-redos-guard@$version" version > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$version is already on npm: nothing to release."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$version is not on npm yet: testing, then publishing."
          fi

  ci:
    needs: check
    if: needs.check.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: [check, ci]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # the git tag and the GitHub Release
      id-token: write # npm trusted publishing and provenance
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing support (11.5.1 or later)
        run: npm install --global npm@11.5.2
      - name: The tag must not exist yet
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "tag v$VERSION already exists"; exit 1
          fi
      - name: Pack
        run: |
          npm pack --ignore-scripts
          echo "INTEGRITY=sha512-$(openssl dgst -sha512 -binary "picomatch-redos-guard-$VERSION.tgz" | openssl base64 -A)" >> "$GITHUB_ENV"
      - name: Publish to npm
        run: npm publish "picomatch-redos-guard-$VERSION.tgz" --access public --provenance
      - name: Tag and GitHub Release with the same tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "picomatch-redos-guard-$VERSION.tgz" \
            --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes \
            --notes "Published to npm with provenance: https://www.npmjs.com/package/picomatch-redos-guard/v/$VERSION

          The attached tarball is the exact file published to npm. Integrity: \`$INTEGRITY\`"
